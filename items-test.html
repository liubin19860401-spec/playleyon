<!DOCTYPE html><html><head><style>
body{background:#f4f1ea;font-family:monospace}
.row{display:flex;gap:16px;padding:20px}
.cell{position:relative}
.face{width:100px;height:100px;border-radius:8px;position:relative;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.face::after{content:"";position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);width:74%;height:74%;background:var(--icon) center/contain no-repeat}
.f0{background:#e5484d;--icon:url(item0.png)}
.f1{background:#ffb224;--icon:url(item1.png)}
.f2{background:#30a46c;--icon:url(item2.png)}
.f3{background:#0091ff;--icon:url(item3.png)}
.f4{background:#8e4ec6;--icon:url(item4.png)}
span{position:absolute;top:-18px;left:0;font-size:12px}
</style></head><body><div class="row">
<div class="cell"><span>f0</span><div class="face f0"></div></div>
<div class="cell"><span>f1</span><div class="face f1"></div></div>
<div class="cell"><span>f2</span><div class="face f2"></div></div>
<div class="cell"><span>f3</span><div class="face f3"></div></div>
<div class="cell"><span>f4</span><div class="face f4"></div></div>
</div></body></html>
